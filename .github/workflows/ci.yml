name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start e2e services
        run: docker compose up -d --wait --wait-timeout 120
      - name: Run e2e tests
        run: pnpm test:e2e
      - name: Show e2e service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop e2e services
        if: always()
        run: docker compose down --volumes
      - run: pnpm build
